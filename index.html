:root{
  --ink-950:#08130E; --pine-900:#0C3527; --pine-800:#104433;
  --emerald-700:#137A56; --emerald-600:#17805B; --emerald-500:#1FA173;
  --mint-300:#63DBA6; --mint-100:#DFF5EA;
  --paper:#F4F8F5; --surface:#FFFFFF; --line:#E2EBE5; --line-strong:#CBDAD1;
  --text:#13221B; --text-2:#4E6157; --text-3:#8AA096;
  --ok:#1FA173; --ok-bg:#E4F6EE; --warn:#D99A26; --warn-bg:#FBF1DC;
  --danger:#D45050; --danger-bg:#FBE7E7; --info:#3E7BD6; --info-bg:#E7EFFB;
  --idle:#8AA096; --idle-bg:#EEF2EF;
  --sh-1:0 1px 2px rgba(8,19,14,.05),0 1px 3px rgba(8,19,14,.06);
  --sh-2:0 4px 14px rgba(8,19,14,.08);
  --sh-3:0 14px 40px rgba(8,19,14,.16);
  --r-s:10px; --r-m:14px; --r-l:20px;
  --sidebar-w:252px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Assistant',sans-serif;background:var(--paper);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Rubik',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::selection{background:var(--mint-300);color:var(--ink-950)}
:focus-visible{outline:2px solid var(--emerald-500);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#splash{position:fixed;inset:0;background:radial-gradient(1200px 700px at 70% -10%,#123c2d 0%,var(--ink-950) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999}
#splash .ring{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--mint-300);animation:spin .9s linear infinite}
#splash p{color:#cfe8db;font-family:'Rubik';letter-spacing:.04em}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login */
.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-hero{background:radial-gradient(900px 600px at 20% 0%,rgba(60,20,20,.55) 0%,transparent 55%),radial-gradient(1100px 800px at 85% 90%,#155741 0%,transparent 60%),linear-gradient(160deg,#101b15 0%,var(--ink-950) 45%,#0d3d2d 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:64px;position:relative;overflow:hidden}
.login-hero .arc{position:absolute;width:520px;height:520px;border:2px solid rgba(99,219,166,.22);border-radius:50%;top:-160px;left:-160px;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(35deg)}
.login-hero .arc.b{width:780px;height:780px;top:auto;left:auto;bottom:-300px;right:-260px;border-color:rgba(255,255,255,.08)}
.brand-mark{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.login-hero h1{font-size:44px;font-weight:900;line-height:1.15;margin-bottom:14px}
.login-hero h1 span{color:var(--mint-300)}
.login-hero p{color:#bcd8ca;font-size:17px;max-width:420px;line-height:1.7}
.hero-steps{margin-top:44px;display:flex;flex-direction:column;gap:14px}
.hero-step{display:flex;align-items:center;gap:12px;color:#e6f4ec;font-size:15px}
.hero-step b{font-family:'Rubik';font-weight:600}
.hero-step .n{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(99,219,166,.5);display:grid;place-items:center;font-family:'Rubik';font-size:13px;color:var(--mint-300);flex-shrink:0}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--surface)}
.login-card{width:100%;max-width:400px}
.login-card h2{font-size:26px;font-weight:800;margin-bottom:6px}
.login-card>p{color:var(--text-2);margin-bottom:28px}
.login-users{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.login-users .cap{font-size:12.5px;color:var(--text-3);margin-bottom:10px;font-weight:600}
.quick-user{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:var(--r-s);border:1px solid var(--line);margin-bottom:8px;text-align:right;transition:all .12s;background:#fff}
.quick-user:hover{border-color:var(--emerald-500);background:var(--mint-100)}
.quick-user .role-tag{margin-inline-start:auto}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:'Rubik';font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.quick-user b{font-size:14px;display:block}
.quick-user small{color:var(--text-3);font-size:12px}

.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--text-2)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r-s);font-size:15px;background:#fff;transition:border-color .15s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--emerald-500);outline:none;box-shadow:0 0 0 3px rgba(31,161,115,.13)}
.field.err input,.field.err select{border-color:var(--danger);background:#FFFBFB}
.field .f-err{color:var(--danger);font-size:12px;margin-top:5px;font-weight:600}
.field .f-help{color:var(--text-3);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;font-family:'Rubik';font-weight:600;font-size:14.5px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--emerald-600);color:#fff;box-shadow:0 6px 16px rgba(23,128,91,.28)}
.btn-primary:hover{background:var(--emerald-500);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{border:1.5px solid var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--emerald-500);color:var(--emerald-700);background:var(--mint-100)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-block{width:100%}

/* Shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:linear-gradient(178deg,var(--pine-900) 0%,var(--ink-950) 78%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .t b{font-family:'Rubik';font-size:16.5px;font-weight:700;display:block;line-height:1.2}
.sb-brand .t small{color:#8fbfa9;font-size:11.5px}
.sb-nav{padding:14px 12px;flex:1;overflow-y:auto}
.sb-cap{font-size:11px;letter-spacing:.06em;color:#6e9483;padding:14px 10px 6px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#cfe4d8;font-size:14.5px;font-weight:500;margin-bottom:2px;text-align:right;transition:all .12s;position:relative}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:rgba(99,219,166,.14);color:#fff;font-weight:600}
.sb-item.active::before{content:'';position:absolute;right:-12px;top:8px;bottom:8px;width:3.5px;border-radius:3px;background:var(--mint-300)}
.sb-item .cnt{margin-inline-start:auto;background:var(--mint-300);color:var(--ink-950);font-family:'Rubik';font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px}
.sb-item .cnt.hot{background:#ff8a8a;color:#3a0d0d}
.sb-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
.sb-user b{font-size:13.5px;display:block}
.sb-user small{color:#8fbfa9;font-size:11.5px}
.sb-user button{margin-inline-start:auto;color:#8fbfa9;font-size:12px;padding:6px}
.sb-user button:hover{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;position:sticky;top:0;z-index:40}
.gsearch{flex:1;max-width:440px;position:relative}
.gsearch input{width:100%;padding:9px 38px 9px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:var(--paper);transition:all .15s}
.gsearch input:focus{background:#fff;border-color:var(--emerald-500);box-shadow:0 0 0 3px rgba(31,161,115,.12);outline:none}
.gsearch .gi{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.topbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);position:relative;transition:background .12s}
.icon-btn:hover{background:var(--paper)}
.icon-btn .dot{position:absolute;top:5px;left:5px;min-width:16px;height:16px;border-radius:99px;background:var(--danger);border:2px solid #fff;color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-family:'Rubik';padding:0 3px}
.content{padding:26px 30px 120px;max-width:1340px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:800}
.page-head p{color:var(--text-2);margin-top:3px;font-size:14px}
.page-head .actions{margin-inline-start:auto;display:flex;gap:10px}

/* Components */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;box-shadow:var(--sh-1);transition:all .15s;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--sh-2);transform:translateY(-2px);border-color:var(--line-strong)}
.kpi .v{font-family:'Rubik';font-size:26px;font-weight:800;line-height:1.1}
.kpi .l{color:var(--text-2);font-size:13px;margin-top:4px;font-weight:600}
.kpi .trend{font-size:12px;margin-top:7px;font-weight:600;color:var(--text-3)}
.kpi.tone-ok .v{color:var(--emerald-700)} .kpi.tone-warn .v{color:var(--warn)} .kpi.tone-danger .v{color:var(--danger)}
.kpi .glow{position:absolute;left:-30px;top:-30px;width:90px;height:90px;border-radius:50%;opacity:.35;filter:blur(2px);border:2px solid currentColor;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(40deg);color:var(--line-strong)}
.kpi.tone-ok .glow{color:var(--mint-300)} .kpi.tone-warn .glow{color:var(--warn)} .kpi.tone-danger .glow{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-h{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:16px;font-weight:700}
.card-h .sub{color:var(--text-3);font-size:12.5px;font-weight:400;margin-top:2px}
.card-h .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:18px 20px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3.5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge .bd{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.b-ok{background:var(--ok-bg);color:#116548} .b-warn{background:var(--warn-bg);color:#8a5f0e}
.b-danger{background:var(--danger-bg);color:#9c3030} .b-info{background:var(--info-bg);color:#2a5aa8}
.b-idle{background:var(--idle-bg);color:#5e7268}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:right;font-size:12px;color:var(--text-3);font-weight:700;letter-spacing:.02em;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr{transition:background .1s}
.dt tbody tr.click{cursor:pointer}
.dt tbody tr.click:hover{background:#F7FBF8}
.dt tbody tr:last-child td{border-bottom:none}
.dt .fam{font-weight:700;font-family:'Rubik';font-size:14px}
.dt .mini{color:var(--text-3);font-size:12px;margin-top:2px}
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg) scaleX(-1)}
.ring .rv{position:absolute;font-family:'Rubik';font-weight:700}
.queue-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .1s;cursor:pointer}
.queue-item:hover{background:#F7FBF8}
.queue-item:last-child{border-bottom:none}
.q-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.queue-item .qt b{font-weight:700;font-size:14.5px}
.queue-item .qt p{color:var(--text-2);font-size:13px;margin-top:2px}
.queue-item .q-act{margin-inline-start:auto;flex-shrink:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:13px;font-weight:600;color:var(--text-2);transition:all .12s}
.chip:hover{border-color:var(--emerald-500);color:var(--emerald-700)}
.chip.on{background:var(--pine-900);border-color:var(--pine-900);color:#fff}
.search-inline{position:relative}
.search-inline input{padding:8px 34px 8px 14px;border:1.5px solid var(--line-strong);border-radius:999px;font-size:13.5px;width:220px;background:#fff}
.search-inline .gi{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
.empty{padding:48px 20px;text-align:center;color:var(--text-3)}
.empty .e-ico{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;border:2px dashed var(--line-strong);display:grid;place-items:center;font-size:24px}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:4px}
.progress-line{height:7px;border-radius:99px;background:var(--idle-bg);overflow:hidden;min-width:60px}
.progress-line i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--emerald-500),var(--mint-300))}

/* Client */
.client-hero{background:radial-gradient(700px 400px at 85% 110%,#155741 0%,transparent 60%),linear-gradient(150deg,#0f2019 0%,var(--pine-900) 60%,#12513c 100%);border-radius:var(--r-l);color:#fff;padding:30px 32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;position:relative;overflow:hidden}
.client-hero .arc{position:absolute;width:340px;height:340px;border:2px solid rgba(99,219,166,.2);border-radius:50%;top:-120px;left:-90px;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(30deg)}
.client-hero h2{font-size:22px;font-weight:800;margin-bottom:6px}
.client-hero p{color:#bcd8ca;font-size:14.5px;max-width:480px;line-height:1.6}
.next-action-card{background:linear-gradient(120deg,var(--mint-100),#fff);border:1.5px solid var(--mint-300)}
.checklist-item{display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:1px solid var(--line)}
.checklist-item:last-child{border-bottom:none}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;font-weight:700}
.ck.done{background:var(--ok-bg);color:var(--ok)} .ck.todo{border:2px dashed var(--line-strong);color:var(--text-3)}
.checklist-item .cl-t{flex:1}
.checklist-item b{font-size:14.5px;font-weight:600}
.checklist-item small{color:var(--text-3);display:block;font-size:12.5px;margin-top:1px}

/* Wizard */
.wizard{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.wz-steps{position:sticky;top:84px}
.wz-step{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;width:100%;text-align:right;font-size:13.5px;font-weight:600;color:var(--text-2);transition:all .12s;margin-bottom:2px}
.wz-step:hover{background:#fff}
.wz-step.cur{background:var(--pine-900);color:#fff;box-shadow:var(--sh-2)}
.wz-step.done{color:var(--emerald-700)}
.wz-step .wn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Rubik';font-size:12px;flex-shrink:0;border:1.5px solid var(--line-strong);background:#fff;color:var(--text-2)}
.wz-step.cur .wn{border-color:var(--mint-300);background:transparent;color:var(--mint-300)}
.wz-step.done .wn{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.wz-body{min-width:0}
.wz-chapter-head{margin-bottom:20px}
.wz-chapter-head .eyebrow{font-size:12.5px;font-weight:700;color:var(--emerald-700);margin-bottom:4px}
.wz-chapter-head h2{font-size:21px;font-weight:800}
.wz-chapter-head p{color:var(--text-2);margin-top:5px;font-size:14px}
.wz-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;margin-bottom:16px;box-shadow:var(--sh-1)}
.wz-sec>h4{font-size:14.5px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--pine-900)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f-row .full{grid-column:1/-1}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill-opt{padding:8.5px 17px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:13.5px;font-weight:600;color:var(--text-2);transition:all .12s;background:#fff}
.pill-opt:hover{border-color:var(--emerald-500)}
.pill-opt.on{background:var(--emerald-600);border-color:var(--emerald-600);color:#fff}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.check-opt{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:13.5px;font-weight:600;background:#fff;transition:all .12s;text-align:right}
.check-opt:hover{border-color:var(--emerald-500)}
.check-opt.on{background:var(--mint-100);border-color:var(--emerald-500);color:var(--pine-900)}
.check-opt .cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:11px;flex-shrink:0;background:#fff}
.check-opt.on .cb{background:var(--emerald-600);border-color:var(--emerald-600);color:#fff}
.rep-item{border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px;margin-bottom:12px;position:relative;background:#FBFDFC}
.rep-item .rm{position:absolute;top:10px;left:10px;color:var(--text-3);font-size:12px;padding:5px 9px;border-radius:8px}
.rep-item .rm:hover{background:var(--danger-bg);color:var(--danger)}
.rep-item h5{font-size:13px;color:var(--emerald-700);margin-bottom:12px;font-family:'Rubik'}
.wz-footer{display:flex;align-items:center;gap:12px;margin-top:6px;padding:16px 0}
.wz-footer .autosave{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.wz-topline{display:flex;align-items:center;gap:14px;margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;box-shadow:var(--sh-1)}
.wz-topline b{font-family:'Rubik';font-size:13px;white-space:nowrap}

/* Docs */
.doc-card{display:flex;align-items:center;gap:15px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.doc-card:last-child{border-bottom:none}
.doc-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--paper);border:1px solid var(--line)}
.doc-card .dt-t{flex:1;min-width:180px}
.doc-card b{font-size:14.5px;font-weight:700;display:block}
.doc-card small{color:var(--text-3);font-size:12.5px}
.doc-card .d-file{color:var(--emerald-700);font-size:12.5px;font-weight:600;margin-top:2px;direction:ltr;text-align:right;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.doc-reject{background:var(--danger-bg);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#9c3030;margin-top:7px;font-weight:600}
.doc-acts{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* Family 360 */
.crumb{font-size:13.5px;color:var(--text-3);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.crumb button{color:var(--emerald-700);font-weight:600;font-size:13.5px}
.crumb button:hover{text-decoration:underline}
.f360-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 24px 18px;margin-bottom:16px;box-shadow:var(--sh-1)}
.f360-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.f360-top h1{font-size:24px;font-weight:800}
.f360-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-2);font-size:13.5px;margin-top:7px}
.f360-meta span{display:inline-flex;gap:6px;align-items:center}
.f360-side{margin-inline-start:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.na-banner{margin-top:16px;border-radius:var(--r-m);padding:14px 18px;display:flex;gap:13px;align-items:center;flex-wrap:wrap;border:1.5px solid}
.na-banner .na-cap{font-size:12px;font-weight:700;letter-spacing:.02em;opacity:.75}
.na-banner b{font-size:15px;font-family:'Rubik'}
.na-ok{background:var(--ok-bg);border-color:rgba(31,161,115,.35);color:#0e5a3f}
.na-warn{background:var(--warn-bg);border-color:rgba(217,154,38,.4);color:#7a540c}
.na-danger{background:var(--danger-bg);border-color:rgba(212,80,80,.35);color:#8f2c2c}
.na-info{background:var(--info-bg);border-color:rgba(62,123,214,.3);color:#274f92}
.na-idle{background:var(--idle-bg);border-color:var(--line-strong);color:var(--text-2)}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--text-2);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap;font-family:'Rubik';display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--emerald-700);border-color:var(--emerald-600)}
.tab-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--emerald-600);color:#fff;font-size:11px;font-weight:700;margin-inline-start:6px}
.tab .tc{background:var(--idle-bg);color:var(--text-2);border-radius:99px;font-size:11px;padding:1px 7px}
.tab.on .tc{background:var(--mint-100);color:var(--emerald-700)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
.svc-mini{border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 15px;background:#fff;text-align:right;transition:all .12s;cursor:pointer}
.svc-mini:hover{border-color:var(--emerald-500);box-shadow:var(--sh-2);transform:translateY(-1px)}
.svc-mini .sm-top{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px;font-family:'Rubik';margin-bottom:8px}
.svc-mini .sm-pro{font-size:12px;color:var(--text-3);margin-top:7px}
.kv{display:grid;grid-template-columns:175px 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--text-3);font-weight:600}
.kv dd{font-weight:600}
.menu-wrap{position:relative;display:inline-block}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-3);min-width:215px;z-index:70;padding:6px}
.menu-item{display:flex;gap:9px;align-items:center;width:100%;text-align:right;padding:9px 12px;font-size:13.5px;border-radius:8px;font-weight:600;color:var(--text)}
.menu-item:hover{background:var(--paper)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-bg)}
.menu-item:disabled{opacity:.45;cursor:not-allowed}
.click-catch{position:fixed;inset:0;z-index:60}
.pro-pick{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line-strong);border-radius:var(--r-m);padding:13px 15px;width:100%;text-align:right;margin-bottom:9px;transition:all .12s;background:#fff}
.pro-pick:hover{border-color:var(--emerald-500)}
.pro-pick.on{border-color:var(--emerald-600);background:var(--mint-100);box-shadow:0 0 0 3px rgba(31,161,115,.12)}
.pro-pick .radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;margin-top:3px;display:grid;place-items:center}
.pro-pick.on .radio{border-color:var(--emerald-600)}
.pro-pick.on .radio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--emerald-600)}
.pro-stats{display:flex;gap:13px;font-size:12px;color:var(--text-2);margin-top:5px;flex-wrap:wrap}
.pro-stats b{font-family:'Rubik'}
.share-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;margin-bottom:14px}
.share-box h5{font-size:12.5px;color:var(--emerald-700);margin-bottom:8px;font-family:'Rubik'}
.share-box ul{list-style:none}
.share-box li{padding:3px 0;display:flex;gap:8px;align-items:baseline}
.share-box li::before{content:'•';color:var(--emerald-500)}
.tl-row{display:flex;gap:14px;position:relative}
.tl-rail{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);flex-shrink:0;margin-top:5px}
.tl-dot.first{background:var(--emerald-500)}
.tl-line{width:2px;flex:1;background:var(--line)}
.tl-body{padding-bottom:18px}
.tl-body .tl-t{font-size:14px;font-weight:600}
.tl-body .tl-d{font-size:12px;color:var(--text-3);margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(8,19,14,.55);z-index:95;display:grid;place-items:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-3);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:popIn .18s ease}
.modal.lg{max-width:660px}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{padding:20px 24px 0;display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:#fff;z-index:2;padding-bottom:12px}
.modal-h h3{font-size:18px;font-weight:800}
.modal-h p{color:var(--text-2);font-size:13.5px;margin-top:4px}
.modal-h .x{margin-inline-start:auto;color:var(--text-3);font-size:18px;padding:4px 8px;border-radius:8px}
.modal-h .x:hover{background:var(--paper);color:var(--text)}
.modal-b{padding:6px 24px 24px}
.consent-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;font-size:13.5px;line-height:1.7;color:var(--text-2);max-height:170px;overflow-y:auto;margin-bottom:16px}
.sig-preview{border:1.5px dashed var(--line-strong);border-radius:var(--r-m);min-height:74px;display:grid;place-items:center;margin:10px 0 16px;font-size:26px;color:var(--pine-900);background:#FCFEFC}
.email-view{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;font-size:13.5px;line-height:1.75}
.email-view .ev-sub{font-weight:700;font-family:'Rubik';border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px}
.notif-pop{position:absolute;top:calc(100% + 8px);left:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-3);z-index:70;max-height:420px;overflow-y:auto}
.notif-item{padding:12px 15px;border-bottom:1px solid var(--line);font-size:13px}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:#F5FBF8}
.notif-item b{font-size:13.5px;display:flex;gap:7px;align-items:center}
.notif-item .nd{color:var(--text-2);margin-top:2px}
.notif-item .nt{color:var(--text-3);font-size:11.5px;margin-top:3px}
.demo-bar{position:fixed;bottom:16px;left:16px;z-index:90;background:var(--ink-950);color:#fff;border-radius:16px;box-shadow:var(--sh-3);display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid rgba(99,219,166,.25);flex-wrap:wrap;max-width:calc(100vw - 32px)}
.demo-bar .db-cap{font-size:11px;color:#8fbfa9;padding:0 6px 0 2px;font-weight:700;letter-spacing:.03em}
.demo-role{padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;color:#cfe4d8;transition:all .12s}
.demo-role:hover{background:rgba(255,255,255,.09);color:#fff}
.demo-role.on{background:var(--mint-300);color:var(--ink-950)}
.demo-bar select{background:rgba(255,255,255,.08);color:#cfe4d8;border:1px solid rgba(255,255,255,.15);border-radius:9px;font-size:12px;padding:6px 8px}
.role-tag{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:999px;white-space:nowrap}
.rt-client{background:var(--info-bg);color:#2a5aa8} .rt-rep{background:var(--mint-100);color:#116548}
.rt-pro{background:var(--warn-bg);color:#8a5f0e} .rt-admin{background:#EEE9FB;color:#5b3fa8}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--ink-950);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-3);font-size:13.5px;display:flex;gap:10px;align-items:center;animation:toastIn .25s ease;border:1px solid rgba(99,219,166,.3);max-width:380px}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-row{display:flex;gap:10px;margin-bottom:12px}
.msg-bubble{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;max-width:78%}
.msg-row.me{flex-direction:row-reverse}
.msg-row.me .msg-bubble{background:var(--mint-100);border-color:rgba(31,161,115,.3)}
.msg-meta{font-size:11px;color:var(--text-3);margin-top:4px}

/* Analysis Workspace (שלב 4) */
.aw-blocked{background:var(--warn-bg);border:1.5px solid rgba(217,154,38,.4);border-radius:var(--r-m);padding:14px 18px;margin-bottom:18px;color:#7a540c;display:flex;gap:12px;align-items:flex-start}
.aw-blocked b{display:block;font-size:14.5px;margin-bottom:3px}
.tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tone-opt{border:1.5px solid var(--line-strong);border-radius:var(--r-m);padding:16px 10px;text-align:center;background:#fff;transition:all .12s}
.tone-opt:hover{border-color:var(--line-strong);box-shadow:var(--sh-1)}
.tone-opt .te{font-size:26px;display:block;margin-bottom:6px}
.tone-opt .tl{font-size:12.5px;font-weight:700;color:var(--text-2)}
.tone-opt.on{border-color:var(--emerald-600);background:var(--mint-100);box-shadow:0 0 0 3px rgba(31,161,115,.13)}
.tone-opt.on .tl{color:var(--pine-900)}
.finding-row{border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:10px;background:#FBFDFC;position:relative}
.finding-row .rm{position:absolute;top:9px;left:9px;color:var(--text-3);font-size:12px;padding:4px 8px;border-radius:8px}
.finding-row .rm:hover{background:var(--danger-bg);color:var(--danger)}
.sev-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sev-pill{padding:5px 12px;border-radius:999px;border:1.5px solid var(--line-strong);font-size:12px;font-weight:600;color:var(--text-2);background:#fff}
.sev-pill.on-ok{background:var(--idle-bg);border-color:var(--idle);color:var(--text-2)}
.sev-pill.on-improve{background:var(--info-bg);border-color:var(--info);color:#274f92}
.sev-pill.on-important{background:var(--warn-bg);border-color:var(--warn);color:#7a540c}
.sev-pill.on-urgent{background:var(--danger-bg);border-color:var(--danger);color:#8f2c2c}
.client-summary-box textarea{background:#F4FBF7;border-color:var(--mint-300)}
.internal-box textarea{background:#FAFAF9}
.attach-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.attach-row:last-child{border-bottom:none}
.attach-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sticky-actionbar{position:sticky;bottom:82px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh-3);padding:10px 16px;display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}

/* Meeting Mode (שלב 5) */
.mi-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.mi-row:last-child{border-bottom:none}
.mi-row b{font-size:14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}

/* Presentation Mode — full screen */
.present-shell{position:fixed;inset:0;background:var(--paper);z-index:200;display:flex;flex-direction:column;height:100dvh}
.present-top{height:60px;background:var(--pine-900);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;flex-shrink:0}
.present-top .pfam{font-family:'Rubik';font-weight:700;font-size:16px}
.present-top .psub{color:#9dc4b2;font-size:12.5px}
.present-top .spacer{flex:1}
.present-progress{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.present-progress b{font-family:'Rubik';font-size:13px;white-space:nowrap}
.present-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;padding:34px 20px 40px}
.present-card{width:100%;max-width:760px;padding-bottom:8px}
.present-drawer{position:fixed;top:60px;bottom:0;left:0;width:260px;background:#fff;border-left:1px solid var(--line);z-index:210;overflow-y:auto;padding:14px 10px;transform:translateX(-100%);transition:transform .2s}
.present-drawer.open{transform:none}
.drawer-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;width:100%;text-align:right;color:var(--text-2);font-weight:600}
.drawer-item:hover{background:var(--paper)}
.drawer-item.cur{background:var(--mint-100);color:var(--pine-900)}
.drawer-item .dm{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.present-footer{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px;z-index:205}
.tone-hero{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.tone-hero .em{font-size:40px}
.intro-stat{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1.5px solid var(--line);border-radius:var(--r-m);margin-bottom:10px}
.intro-stat .em{font-size:24px}
.intro-stat b{font-family:'Rubik';font-size:20px}
.fin-stat{display:flex;flex-direction:column;align-items:center;padding:18px;border:1.5px solid var(--line-strong);border-radius:var(--r-m);background:#fff}
.fin-stat b{font-family:'Rubik';font-size:22px;color:var(--emerald-700)}
.fin-stat small{color:var(--text-3);font-size:12px;margin-top:4px}
.decision-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.decision-opt{border:1.5px solid var(--line-strong);border-radius:var(--r-m);padding:16px;text-align:center;background:#fff;transition:all .12s;font-weight:700;font-size:14px}
.decision-opt:hover{box-shadow:var(--sh-1)}
.decision-opt.on{border-color:var(--emerald-600);background:var(--mint-100);box-shadow:0 0 0 3px rgba(31,161,115,.13)}
.exit-guard{position:fixed;inset:0;background:rgba(8,19,14,.55);z-index:220;display:grid;place-items:center}
.doc-pill{border-color:var(--emerald-500);color:var(--emerald-700)}
.doc-viewer-bg{position:fixed;inset:0;background:rgba(8,19,14,.7);z-index:230;display:grid;place-items:center;padding:24px}
.doc-viewer{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-3);width:100%;max-width:640px;max-height:88vh;overflow-y:auto}
.doc-viewer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.doc-viewer-h b{font-size:16px;display:block}
.doc-viewer-h small{color:var(--text-3);font-size:12.5px}
.doc-viewer-h .x{margin-inline-start:auto;color:var(--text-3);font-size:18px;padding:4px 8px;border-radius:8px}
.doc-viewer-h .x:hover{background:var(--paper);color:var(--text)}
.doc-viewer-b{padding:20px 22px}
.doc-preview-mock{border:1.5px dashed var(--line-strong);border-radius:var(--r-m);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#FBFDFC,#F4F8F5);color:var(--text-3)}
.doc-preview-mock .dpi{font-size:56px}
.doc-badge-internal{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:#7a540c;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:14px}

/* Execution Center (שלב 6) */
.exec-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.exec-kpi{border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:#fff;text-align:center}
.exec-kpi b{font-family:'Rubik';font-size:22px;display:block}
.exec-kpi small{font-size:11.5px;color:var(--text-3);font-weight:600}
.exec-card{border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px 18px;margin-bottom:12px;background:#fff}
.exec-card .xc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.exec-card .xc-head b{font-family:'Rubik';font-size:15px;display:inline-flex;gap:8px;align-items:center}
.exec-card .xc-meta{font-size:12.5px;color:var(--text-3);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.exec-ball{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.exec-ball.info{background:var(--info-bg);color:#274f92}
.exec-ball.warn{background:var(--warn-bg);color:#7a540c}
.exec-ball.ok{background:var(--ok-bg);color:var(--emerald-700)}
.exec-ball.idle{background:var(--idle-bg);color:var(--text-2)}
.contact-card{display:flex;flex-direction:column;gap:8px;background:var(--mint-100);border:1.5px solid var(--mint-300);border-radius:var(--r-m);padding:16px 18px}
.contact-card .cc-row{display:flex;align-items:center;gap:10px;font-size:14px}
.contact-card .cc-row b{min-width:64px;font-size:12.5px;color:var(--text-3);font-weight:700}
.btn-call{display:inline-flex;align-items:center;gap:8px;background:var(--emerald-600);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;text-decoration:none}
.btn-call:hover{background:var(--emerald-700)}
.exec-update-row{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.exec-update-row:last-child{border-bottom:none}
.exec-update-row .eu-ico{font-size:16px;flex-shrink:0}
.exec-update-row .eu-body b{font-size:12px;color:var(--text-3);font-weight:600;display:block;margin-bottom:2px}
.exec-section{margin-bottom:14px}
.exec-approved-box{background:var(--mint-100);border:1.5px solid var(--mint-300);border-radius:var(--r-m);padding:16px 18px}
.exec-approved-box h5{font-size:12.5px;color:var(--emerald-700);font-weight:700;margin-bottom:8px}
.doc-warning{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1.5px solid rgba(217,154,38,.4);border-radius:var(--r-m);padding:11px 14px;font-size:13px;color:#7a540c;margin-top:10px}
.doc-check-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.doc-check-row:last-child{border-bottom:none}
.doc-check-row .dc-tag{font-size:11px;color:var(--text-3);background:var(--paper);border-radius:999px;padding:2px 9px}
@media(max-width:760px){.exec-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1020px){.present-drawer{width:220px}.present-top{padding:0 14px}.present-body{padding:20px 14px 28px}}
.sticky-actionbar .draft-state{font-size:12.5px;color:var(--text-3);margin-inline-end:auto}
.readview dt{color:var(--text-3);font-weight:600}
.finding-view{border-inline-start:3px solid var(--line-strong);padding:8px 14px;margin-bottom:10px}
.finding-view b{display:block;font-size:14px}
.finding-view p{color:var(--text-2);font-size:13.5px;margin-top:3px}
@media (max-width:1020px){
  .tone-grid{grid-template-columns:repeat(2,1fr)}
  .sticky-actionbar{position:static;border-radius:var(--r-m)}
}

@media (max-width:1020px){
  .login-page{grid-template-columns:1fr}
  .login-hero{display:none}
  .sidebar{position:fixed;right:0;z-index:80;transform:translateX(100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:var(--sh-3)}
  .content{padding:18px 16px 140px}
  .menu-btn{display:grid!important}
  .wizard{grid-template-columns:1fr}
  .wz-steps{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}
  .wz-step{flex-shrink:0;width:auto}
  .f-row{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .svc-scroll{overflow-x:auto}
  .svc-scroll table{min-width:860px}
  .dash-cols{grid-template-columns:1fr!important}
}
.menu-btn{display:none;place-items:center}
/* ===== v9 — מסך Setup ובאנר מצב הדגמה ===== */
.setup-screen{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 700px at 70% -10%,#123c2d 0%,var(--ink-950) 55%)}
.setup-card{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-3);max-width:640px;
  padding:34px 32px;line-height:1.75}
.setup-card .setup-ico{font-size:40px;margin-bottom:12px}
.setup-card h1{font-size:22px;font-weight:800;margin-bottom:12px}
.setup-card p{color:var(--text-2);font-size:14px;margin-bottom:14px}
.setup-card code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.setup-code{background:var(--ink-950);color:#9dc4b2;border-radius:var(--r-m);padding:14px 16px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:ltr;text-align:left;
  overflow-x:auto;margin-bottom:16px;line-height:1.7}
.setup-note{background:var(--warn-bg);border-radius:var(--r-m);padding:11px 14px;font-size:13px}
.setup-steps{background:var(--info-bg);border-radius:var(--r-m);padding:12px 15px;font-size:13px;margin-top:8px}
.demo-banner{position:sticky;top:0;z-index:70;background:var(--warn-bg);color:#7a540c;
  text-align:center;padding:7px 14px;font-size:12.5px;font-weight:700;border-bottom:1px solid #e5c98a}

/* ===== v7 — Admin & System Builder ===== */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar .search-input{flex:1 1 260px;min-width:200px;padding:9px 13px;border:1.5px solid var(--line);border-radius:var(--r-m);
  font-family:inherit;font-size:13.5px;background:#fff;color:var(--text)}
.filter-bar .search-input:focus{outline:none;border-color:var(--emerald-500)}
.filter-bar select{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--r-m);background:#fff;
  font-family:inherit;font-size:13px;color:var(--text-2);cursor:pointer}
.filter-bar select:focus{outline:none;border-color:var(--emerald-500)}
.adm-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
.adm-table thead th{text-align:right;padding:11px 14px;background:var(--paper);border-bottom:1.5px solid var(--line);
  font-size:12px;font-weight:700;color:var(--text-3);white-space:nowrap}
.adm-table tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.adm-table tbody tr:last-child td{border-bottom:none}
.adm-table tbody tr:hover{background:#FBFDFC}
.adm-table tr.row-off{opacity:.55}
.adm-table td.num{font-family:'Rubik';font-size:13px;text-align:center}
.link-cell{text-align:right;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;color:inherit}
.link-cell b{display:block;font-size:13.5px}
.link-cell small{display:block;color:var(--text-3);font-size:11.5px;margin-top:1px}
.link-cell:hover b{color:var(--emerald-700);text-decoration:underline}
.chip-wrap{display:flex;gap:5px;flex-wrap:wrap;max-width:280px}
.mini-chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--text-2);white-space:nowrap}
.key-code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--paper);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--text-2)}
.mini-input{width:66px;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;font-family:'Rubik';
  font-size:12.5px;text-align:center;background:#fff;color:var(--text)}
.mini-input:focus{outline:none;border-color:var(--emerald-500)}
.mini-select{padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;
  font-size:12.5px;background:#fff;color:var(--text-2);max-width:170px}
.mini-select:focus{outline:none;border-color:var(--emerald-500)}
.form-sec{font-size:12.5px;font-weight:700;color:var(--text-3);margin:20px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.form-sec .sec-hint{font-weight:500;font-size:11.5px;color:var(--text-3)}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-err{background:var(--danger-bg);color:#8a1c1c;border-radius:var(--r-m);padding:10px 13px;
  font-size:13px;font-weight:600;margin-bottom:14px}
.field .hint{display:block;color:var(--text-3);font-size:11.5px;margin-top:4px;line-height:1.5}
.chk-grid{display:flex;flex-wrap:wrap;gap:7px}
.chk-pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;
  border-radius:999px;padding:7px 13px;font-family:inherit;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.14s}
.chk-pill:hover{border-color:var(--line-strong)}
.chk-pill.on{background:var(--ok-bg);border-color:var(--emerald-500);color:var(--emerald-700);font-weight:600}
.switch-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);
  border-radius:var(--r-m);cursor:pointer;background:#fff}
.switch-row:hover{border-color:var(--line-strong)}
.switch-row input{margin-top:2px;width:16px;height:16px;accent-color:var(--emerald-600);cursor:pointer}
.switch-row b{display:block;font-size:13px}
.switch-row small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px;line-height:1.5}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kv-grid small{display:block;color:var(--text-3);font-size:11.5px;margin-bottom:3px}
.kv-grid b{font-size:13.5px}
.info-note{background:var(--info-bg);border-radius:var(--r-m);padding:11px 14px;font-size:12.5px;
  color:var(--text-2);line-height:1.65}
.ord-btns{display:flex;gap:3px}
.ord-btn{width:24px;height:22px;border:1px solid var(--line);background:#fff;border-radius:5px;
  cursor:pointer;font-size:9px;color:var(--text-2);display:grid;place-items:center}
.ord-btn:hover:not(:disabled){background:var(--paper);border-color:var(--line-strong)}
.ord-btn:disabled{opacity:.3;cursor:default}
.cond-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.cond-row input,.cond-row select{padding:8px 11px;border:1.5px solid var(--line);border-radius:var(--r-m);
  font-family:inherit;font-size:13px;background:#fff;color:var(--text);flex:1 1 130px;min-width:110px}
.cond-row input:focus,.cond-row select:focus{outline:none;border-color:var(--emerald-500)}
.cond-row input:disabled{background:var(--paper);color:var(--text-3)}
.and-tag{font-size:11.5px;font-weight:700;color:var(--text-3);background:var(--paper);
  border-radius:999px;padding:3px 9px;flex:0 0 auto}
.toggle-btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--text-3);cursor:pointer;transition:.14s}
.toggle-btn.on{background:var(--ok-bg);border-color:var(--emerald-500);color:var(--emerald-700)}
.tpl-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:right;
  padding:11px 16px;border:none;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
.tpl-item:last-child{border-bottom:none}
.tpl-item b{font-size:13px;font-weight:600}
.tpl-item:hover{background:var(--paper)}
.tpl-item.on{background:var(--ok-bg)}
.tpl-item.on b{color:var(--emerald-700);font-weight:700}
.var-help{margin-top:12px;padding:10px 13px;background:var(--paper);border-radius:var(--r-m);
  font-size:12px;color:var(--text-2);line-height:2}
.email-preview{border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.email-preview .ep-h{padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.email-preview .ep-h small{display:block;color:var(--text-3);font-size:11px;margin-bottom:2px}
.email-preview .ep-h b{font-size:14px}
.email-preview .ep-b{padding:16px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:var(--text-2)}
@media(max-width:760px){
  .form-grid2,.form-grid3{grid-template-columns:1fr}
  .filter-bar .search-input{flex:1 1 100%}
  .filter-bar select{flex:1 1 46%;min-width:0}
  /* טבלאות Admin רחבות — גלילה אופקית במקום חיתוך */
  .adm-table{min-width:640px}
  .kv-grid{grid-template-columns:1fr 1fr}
  .cond-row{gap:6px}
  .cond-row input,.cond-row select{flex:1 1 100%}
  .and-tag{flex:1 1 100%}
  /* מודלים: לא לחרוג מהמסך, וגלילה פנימית תקינה */
  .modal-bg{padding:10px;align-items:flex-start}
  .modal{max-height:calc(100dvh - 20px)}
  .doc-viewer-bg{padding:10px}
  .doc-viewer{max-height:calc(100dvh - 20px)}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tab{flex-shrink:0}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px}
  .page-head .actions{width:100%;flex-wrap:wrap}
}

.modal h3,.modal p{overflow-wrap:anywhere}

/* Help stays in the document flow: no overlays, clipped popovers or hover-only access. */
.question-heading{position:relative;min-height:44px;padding-inline-end:48px;margin-bottom:6px;min-width:0}
.question-heading>label,.question-heading>h4,.question-heading>span{display:block;margin:0;padding-top:10px;font-weight:600;line-height:1.5}
.question-help{margin:0;min-width:0;text-align:start;font-weight:400}
.question-help>summary{display:grid;place-items:center;width:44px;height:44px;padding:0;cursor:pointer;list-style:none;border-radius:50%;color:#17664c;background:transparent}
.question-help>summary::-webkit-details-marker{display:none}
.question-help>summary::marker{content:''}
.question-help>summary>span{display:grid;place-items:center;width:24px;height:24px;border:1.5px solid currentColor;border-radius:50%;font:700 16px/1 Arial,sans-serif}
.question-help>summary:hover,.question-help[open]>summary{background:#e4f2e9}
.question-help>summary:focus-visible{outline:3px solid #17815e;outline-offset:2px}
.question-heading>.question-help>summary{position:absolute;top:0;inset-inline-end:0}
.question-help-body{margin:4px 0 12px;padding:16px;background:#f0f8f3;border:1px solid #c6dfd0;border-radius:12px;color:#203f33;font-size:15px;line-height:1.8;overflow-wrap:anywhere}
.question-heading .question-help-body{margin-inline-end:-48px}
.question-help-body>strong{font-size:16px;color:#15553e}
.question-help-body p{margin:9px 0 0;font-size:inherit;line-height:inherit;color:inherit}
.question-help-body .question-help-example{padding-top:10px;margin-top:12px;border-top:1px solid #c6dfd0}
.question-group-help{grid-column:1/-1;width:100%}
.complete-check-option,.check-option{position:relative;padding-inline-end:44px;align-items:start!important;flex-wrap:wrap}
.complete-check-option>.question-help,.check-option>.question-help{flex-basis:100%;width:100%}
.complete-check-option>.question-help>summary,.check-option>.question-help>summary{position:absolute;top:0;inset-inline-end:0}
.complete-check-option>.question-help .question-help-body,.check-option>.question-help .question-help-body{margin-inline-end:-44px}
.complete-check-option>.check-opt{min-height:44px}
@media(max-width:600px){.question-help-body{padding:13px;font-size:15px}.question-heading>label{font-size:15px}}

.comparison-view{margin:20px 0;color:#183e30;text-align:start;line-height:1.75;min-width:0}
.comparison-status{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;margin-bottom:15px;color:#526b60}.comparison-status>span:first-child{background:#e2f2e9;color:#15593d;border-radius:20px;padding:3px 12px;font-weight:700}
.comparison-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.comparison-columns article{padding:24px;border:1px solid #cbded2;border-radius:18px;background:white;min-width:0}.comparison-columns article.comparison-proposed{background:#f0f8f3;border-color:#9dcdb3}.comparison-eyebrow{font-size:12px;letter-spacing:.03em;color:#557464;font-weight:700}.comparison-view h3{font-size:18px;margin:5px 0 14px}.comparison-view p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;margin:10px 0}.comparison-amount{font-weight:800;font-size:32px;color:#147853;line-height:1.3;margin:15px 0}.comparison-amount small{font-size:14px;font-weight:500;margin-inline-start:10px}.comparison-source{display:block;font-size:13px;color:#526b60;border-top:1px solid #dce9e1;padding-top:10px;margin-top:18px;overflow-wrap:anywhere}
.comparison-impact{display:flex;gap:16px 40px;flex-wrap:wrap;margin:18px 0;padding:20px 24px;background:#e5f2e9;border-radius:15px}.comparison-impact>div{flex:1;min-width:150px}.comparison-impact span{display:block;font-size:14px}.comparison-impact strong{display:block;font-size:23px;margin-top:5px}.comparison-impact p{flex-basis:100%;font-size:13px;color:#476454;margin:0}
.comparison-explanation{background:white;border:1px solid #dce9e1;border-radius:15px;padding:24px}.comparison-explanation h3:not(:first-child){margin-top:22px}.comparison-explanation dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px 18px;margin:22px 0 0;padding-top:14px;border-top:1px solid #dce9e1;font-size:14px}.comparison-explanation dd{margin:0;font-weight:600;overflow-wrap:anywhere}.comparison-warning{background:#fff8e9;border:1px solid #ead8ab;padding:12px 16px;border-radius:10px;color:#71521c;font-size:14px!important;line-height:1.7}
.comparison-editor{margin:20px 0;padding:22px;border:1px solid #bdd7c6;border-radius:15px;background:#f5faf6}.comparison-editor>p{line-height:1.7;font-size:14px;margin:10px 0 20px}.comparison-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.comparison-form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}.comparison-form input,.comparison-form select,.comparison-form textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #b4cbbb;border-radius:8px;background:white;color:#183e30;font:inherit}.comparison-wide{grid-column:1/-1}.comparison-form textarea{resize:vertical}.comparison-prep details{border-top:1px solid #dce9e1;padding:16px 0}.comparison-prep summary{cursor:pointer;font-weight:700;padding:8px 0}.comparison-prep p{line-height:1.7}.comparison-prep .btn{margin:6px}
@media(max-width:650px){.comparison-columns,.comparison-form{grid-template-columns:1fr}.comparison-columns article,.comparison-explanation,.comparison-editor{padding:17px}.comparison-amount{font-size:28px}.comparison-explanation dl{grid-template-columns:1fr;gap:3px}.comparison-explanation dd{margin-bottom:10px}.comparison-impact{padding:17px}.comparison-view p{font-size:15px}}

.comparison-demo-notice{font-size:12px!important;color:#526b60;margin:12px 0!important}

ו על הוספת ילד ומלאו את פרטיו. מספר הילדים ותאריכי הלידה מסייעים להתאים את המשך השאלון; אם אין ילדים, ממשיכים הלאה.`),name:x(`השם הפרטי של הילד או הילדה ברשומה זו.`,`מלאו שם לכל ילד בנפרד, כפי שמופיע בספח. כך תוכלו לזהות בהמשך למי שייכים הנתונים והיעדים.`),hmo:x(`קופת החולים שבה הילד או הילדה רשומים.`,`בחרו את שם הקופה עצמה, ולא את שם המסלול המשלים כגון זהב או פלטינום. אפשר לבדוק בכרטיס הקופה או באזור האישי.`),emp:x(`סוג העיסוק הנוכחי: שכיר מקבל תלוש ממעסיק; עצמאי מפעיל עסק; אברך לומד בכולל.`,`בחרו את המצב העיקרי כיום. אם יש שילוב של עבודה ולימודים או של שכירות ועצמאות, ציינו את המקור הנוסף בהכנסות הנוספות והסבירו לנציג.`),work:x(`המעסיק או מקום העבודה שבו אתם עובדים כשכירים.`,`אפשר להעתיק את שם המעסיק מראש תלוש השכר. אם יש כמה מעסיקים, ציינו את שמותיהם והציגו את התלושים לנציג.`),tenure:x(`כמה זמן אתם עובדים אצל המעסיק הנוכחי.`,`מלאו את מספר שנות העבודה בקירוב. אפשר לבדוק את תאריך תחילת העבודה בתלוש או בחוזה; חצי שנה אפשר לרשום כ־0.5.`),gross:x(`שכר ברוטו הוא סכום השכר לפני הניכויים של העובד, כגון מס הכנסה, ביטוח לאומי, ביטוח בריאות והפרשה לפנסיה. הוא אינו הסכום שנכנס לחשבון הבנק.`,`בתלוש חפשו את שורת סך הברוטו. מלאו סכום חודשי בשקלים; אם יש כמה מעסיקים, חברו את הברוטו מהתלושים לאותו חודש. אל תשתמשו בעלות המעסיק או בנתון מצטבר מתחילת השנה. אם החודש חריג, ציינו זאת לנציג.`,`אם סך הברוטו בתלוש הוא 10,000 ₪ והנטו לתשלום הוא 8,200 ₪, כאן ממלאים 10,000.`),net:x(`שכר נטו הוא הסכום לתשלום לעובד לאחר הניכויים שבתלוש. מסים, הפרשות לפנסיה וניכויים נוספים מפחיתים אותו; החזרי הוצאות ותיקונים בתלוש יכולים להשפיע על הסכום לתשלום.`,`חפשו בתלוש את השורה ״נטו לתשלום״ והשוו להעברת המשכורת בבנק. אם יש כמה מעסיקים, חברו את הנטו לתשלום מכל התלושים לאותו חודש. אל תכללו העברות אחרות שהתקבלו לחשבון.`,`אם הברוטו הוא 10,000 ₪ ובשורה ״נטו לתשלום״ מופיעים 8,200 ₪, כאן ממלאים 8,200.`),employers:x(`מספר המעסיקים שמשלמים לכם שכר במקביל כיום.`,`ספרו מעסיקים נפרדים, ולא משמרות או תפקידים. היעזרו בתלושי החודש האחרון. מעסיק קודם שכבר אינכם עובדים אצלו שייך לשאלה על החלפת עבודה.`),job_change:x(`האם עברתם ממעסיק אחד לאחר במהלך השנה הנוכחית.`,`סמנו כן גם אם המעבר היה ללא הפסקה בין העבודות. הכינו תלושים מהמעסיק הקודם ומהחדש לבדיקת רצף ההכנסות.`),biz_type:x(`תחום הפעילות של העסק שלכם.`,`כתבו במה העסק עוסק, למשל הוראה פרטית, עיצוב או מכירת מוצרים. אפשר לציין גם אם העסק רשום כעוסק פטור או מורשה, אם ידוע לכם.`),biz_income:x(`לצורך השאלון, הכוונה לרווח חודשי ממוצע מהעסק: ההכנסות לאחר הוצאות העסק, ולפני מסים והפרשות אישיות. מחזור העסקאות הוא סך המכירות לפני הוצאות, ולכן אינו אותו נתון.`,`היעזרו בדוח רווח והפסד או במי שמנהל את החשבונות, וחשבו ממוצע של כמה חודשים מייצגים. אם אינכם יודעים את הרווח, השאירו להשלמה עם הנציג במקום להזין את המחזור.`,`הכנסות של 15,000 ₪ פחות הוצאות עסק של 5,000 ₪ הן רווח של 10,000 ₪, לפני מסים והפרשות אישיות.`),biz_years:x(`משך הזמן שבו העסק פעיל.`,`מלאו מספר שנים בקירוב מאז תחילת הפעילות. אם העסק נפתח ונסגר בתקופות שונות, ציינו זאת לנציג.`),stopped:x(`האם הייתה הפסקת עבודה ב־12 החודשים האחרונים, למשל בעקבות פיטורים, התפטרות או סיום עבודה זמנית.`,`סמנו לפי מה שקרה בפועל, גם אם אינכם עובדים היום. הכינו את מועד הפסקת העבודה והתלוש האחרון; התשובה אינה קובעת כשלעצמה זכאות לקצבה.`),extra_income:x(`מקורות הכנסה למשפחה מעבר לשכר או להכנסה מהעסק שכבר דיווחתם עליהם.`,`אפשר לסמן כמה אפשרויות. אל תדווחו על אותה הכנסה פעמיים; בבחירת הכנסות אחרות יופיע שדה לפירוט.`),extra_income_other:x(`מקור הכנסה נוסף שאינו מופיע ברשימה.`,`כתבו מהו המקור, האם הוא קבוע או חד־פעמי ומה הסכום בקירוב. לדוגמה: מלגת כולל או תמיכה קבועה מבני משפחה, אם טרם נכללו בתשובות.`),housing:x(`האופן שבו המשפחה מתגוררת כיום: דירה בבעלות, שכירות או מגורים אצל משפחה או בסידור אחר.`,`בחרו לפי הדירה שבה אתם גרים. אם בבעלותכם דירה אחרת שאותה אתם משכירים, ציינו גם הכנסה משכירות והסבירו זאת לנציג.`),prop_value:x(`הערכת שווי הנכס כיום — בכמה הוא עשוי להימכר, ולא המחיר ששילמתם בעבר או יתרת המשכנתא.`,`מלאו אומדן בשקלים אם ידוע לכם. אפשר להיעזר בהערכת שמאי קיימת או בעסקאות דומות; אין צורך להזמין הערכה חדשה רק לצורך השדה.`),prop_count:x(`מספר הנכסים שיש לכם בהם בעלות, כולל הדירה שבה אתם מתגוררים.`,`ספרו כל נכס פעם אחת גם אם הוא משותף לבני הזוג. אם יש חלק מנכס או בעלות עם אחרים, ציינו זאת לנציג.`),rent_amount:x(`התשלום החודשי לבעל הדירה עבור השכירות.`,`העתיקו מחוזה השכירות או מהתשלום האחרון. אל תכללו ארנונה, מים, חשמל או ועד בית, אלא אם אינם ניתנים להפרדה בחוזה; במקרה כזה ציינו זאת לנציג.`),rent_aid_now:x(`סיוע בשכר דירה הוא השתתפות בתשלום השכירות במסגרת תוכנית סיוע. כאן שואלים אם אתם כבר מקבלים סיוע כיום.`,`סמנו כן אם משולם לכם סיוע, ולא רק אם הוגשה בקשה. בדקו באישור הזכאות או בהפקדות. השאלה אינה קובעת אם מגיע לכם סיוע חדש.`),has_mortgage:x(`משכנתא היא הלוואה המובטחת בשעבוד נכס, בדרך כלל לצורך רכישת דירה.`,`סמנו כן אם קיימת משכנתא שטרם נפרעה. בדקו בפירוט ההלוואות בבנק או בדוח המשכנתא האחרון.`),mort_bank:x(`הבנק או הגוף שממנו נלקחה המשכנתא.`,`בדקו בדוח המשכנתא. זה לא בהכרח הבנק שבו מתנהל חשבון העו״ש שלכם. אם אינו מופיע ברשימה, בחרו אחר.`),mort_balance:x(`סכום החוב שנותר כיום במשכנתא, ולא הסכום המקורי שקיבלתם.`,`היעזרו בדוח יתרות עדכני ומלאו בשקלים. יתרה לסילוק עשויה לכלול רכיבים נוספים; הציגו את הדוח לנציג כדי לוודא את הנתון.`),mort_monthly:x(`סכום ההחזר החודשי שמשולם על המשכנתא.`,`חברו את התשלומים של כל המסלולים לפי החיוב האחרון או דוח הבנק. ביטוח חיים ומבנה נבדקים בנפרד, ולכן אל תוסיפו אותם כאן.`),mort_date:x(`המועד שבו נלקחה המשכנתא.`,`בדקו במסמכי ההלוואה או בדוח הבנק. אם היו כמה משיכות או מיחזור, מלאו את התאריך הידוע והסבירו את ההיסטוריה לנציג.`),mort_refi:x(`מיחזור משכנתא הוא החלפת משכנתא קיימת או חלק ממנה בהלוואה בתנאים אחרים, כגון תקופה, ריבית או מסלולים.`,`סמנו כן אם ביצעתם מיחזור, באותו בנק או באחר. שינוי בחיוב החודשי כשלעצמו אינו מעיד על מיחזור. בדקו במסמכי ההלוואה.`),mort_count:x(`מספר הלוואות המשכנתא הנפרדות שיש לכם.`,`אין הכוונה למספר מסלולי הריבית בתוך משכנתא אחת. אם אינכם בטוחים כיצד הבנק מחלק את ההלוואות, בדקו בדוח או השלימו עם הנציג.`),loans:x(`הלוואות שעדיין נותר חוב להחזיר עליהן, מלבד המשכנתא שנרשמה בפרק הקודם.`,`הוסיפו כל הלוואה בנפרד, כולל מבנק, חברת אשראי, גמ״ח או אדם פרטי. אם אין הלוואות פעילות, אין צורך להוסיף רשומה.`),lender:x(`הגוף או האדם שממנו קיבלתם את ההלוואה.`,`כתבו למשל את שם הבנק, חברת האשראי או הגמ״ח. אפשר למצוא את השם בהסכם ההלוואה או בפירוט החיובים.`),balance:x(`סכום החוב שעוד נשאר להחזיר בהלוואה זו.`,`מלאו יתרה עדכנית בשקלים לפי הדוח או בירור עם המלווה. אל תשתמשו בסכום המקורי אם כבר החזרתם חלק ממנו.`),monthly:x(`התשלום החודשי שאתם מחזירים על ההלוואה המסוימת הזאת.`,`מלאו לפי החיוב האחרון או לוח התשלומים. אם ההחזר אינו חודשי או שיש תשלום גדול בסוף, ציינו זאת לנציג.`),rate:x(`ריבית היא המחיר שמשלמים עבור השימוש בכסף שנלווה. לרוב היא מופיעה כאחוז שנתי, ולעיתים כנוסחה כגון פריים בתוספת מרווח.`,`העתיקו מההסכם, למשל 5% לשנה או פריים + 1%. אם ההלוואה ללא ריבית, כתבו זאת; אם אינה ידועה, השאירו ריק לבירור.`),end:x(`המועד המתוכנן לתשלום האחרון של ההלוואה.`,`בדקו בלוח הסילוקין — טבלת מועדי ההחזרים — או בהסכם ההלוואה. אם לא נקבע מועד, השאירו להשלמה עם הנציג.`),savings:x(`חסכונות והשקעות הם כספים שנצברו או הושקעו למטרה עתידית, מעבר לכסף השוטף בעו״ש. חלקם מיועדים לפרישה ואחרים למטרות נוספות.`,`סמנו כל סוג מוצר שיש לאחד מבני הזוג. ליד כל אפשרות יש הסבר נפרד. אם לא יודעים מה קיים, ציינו זאת בשאלת ההיכרות עם החסכונות; אי־ידיעה אינה אומרת שאין חיסכון.`),savings_knowledge:x(`עד כמה אתם מכירים את מוצרי החיסכון הרשומים על שמכם ועל שם בן או בת הזוג.`,`בחרו אם התמונה ידועה, חלקית או לא ידועה. אין צורך לנחש או לסמן שאין מוצרים רק משום שאינכם זוכרים; אפשר להשלים בעזרת דוחות והנציג.`),ins:x(`ביטוח נועד לתת כיסוי למקרים שהוגדרו בתנאי הפוליסה, תמורת תשלום. סוגי ביטוח שונים מכסים סיכונים שונים.`,`סמנו סוגי ביטוח שידוע לכם שקיימים כיום. לחצו ליד כל סוג להסבר. אם לא בטוחים, בדקו ברשימת הפוליסות או מול הסוכן והשלימו עם הנציג; אין להסיק מכך שאין כיסוי.`),has_car:x(`האם יש רכב בבעלות אחד מבני המשפחה.`,`סמנו לפי המצב הנוכחי. אם אתם משתמשים ברכב עבודה או בליסינג ואינכם בטוחים למי הוא שייך, פרטו זאת לנציג.`),tax_filed:x(`בקשה להחזר מס היא פנייה לבדיקה אם שולם מס הכנסה גבוה מהנדרש. הגשת בקשה וקבלת החזר בפועל הן פעולות שונות.`,`סמנו אם הגשתם בקשה בתקופה המופיעה בשאלה, גם אם טרם התקבלה תשובה. בדקו באישורי רשות המסים או אצל מי שהגיש עבורכם; אם אין מידע, בחרו לא יודעים.`),kids_arnona:x(`ארנונה היא תשלום לרשות המקומית על הנכס. הנחה בארנונה מפחיתה את החיוב לפי תנאים שהרשות בודקת.`,`השאלה מתייחסת להנחה שכבר קיימת בחשבון, מכל סיבה, ולא לשאלה אם לדעתכם מגיעה הנחה. בדקו בחשבון הארנונה או באזור האישי של הרשות.`),btl_allowances:x(`קצבאות הן תשלומים שמתקבלים מביטוח לאומי במסגרת תוכניות שונות. כאן מסמנים תשלומים שמתקבלים בפועל.`,`אפשר לבחור כמה סוגים. בדקו באישור התשלומים באזור האישי של ביטוח לאומי. אל תסמנו לא מקבלים במקביל לקצבה; בקשה שבטיפול אינה תשלום שהתקבל.`),ravkav_profile:x(`פרופיל הנחה ברב־קו הוא סיווג של הנוסע שעשוי להקנות הנחה בתחבורה ציבורית לפי התנאים, למשל סטודנט או אזרח ותיק.`,`השאלה היא אם יש לכם מעמד כזה. בדקו את הפרופיל ביישומון או בעמדת שירות. הנציג יוכל לסייע בבירור, אך התשובה כאן אינה אישור זכאות.`),water_persons:x(`מספר הנפשות בחשבון המים הוא מספר המתגוררים בדירה הרשום אצל ספק המים. הוא משמש בחישוב כמות המים בתעריף הבסיסי.`,`בדקו בחשבון את שורת מספר הנפשות והשוו למתגוררים בבית כיום, כולל הילדים. אם אינכם מוצאים את הנתון, בחרו לא יודעים לבירור בהמשך.`),bank_count:x(`מספר חשבונות הבנק הפעילים של בני הזוג, כולל משותפים ונפרדים.`,`ספרו חשבון משותף פעם אחת. פיקדון או הלוואה בתוך חשבון אינם חשבון נוסף. היעזרו ברשימת החשבונות ביישומוני הבנקים.`),banks:x(`הבנקים שבהם מתנהלים החשבונות שספרתם.`,`אפשר לבחור כמה בנקים. אם יש כמה חשבונות באותו בנק, מסמנים אותו פעם אחת. אין צורך להזין מספר חשבון, סיסמה או קוד כניסה.`),cc_count:x(`מספר כרטיסי האשראי הפעילים של בני הזוג, בנקאיים וחוץ־בנקאיים.`,`ספרו כל כרטיס פעיל פעם אחת. אין צורך למסור מספר כרטיס, תוקף, קוד סודי או שלוש ספרות אבטחה.`),monthly_fees:x(`עמלות הן תשלומים עבור שירותי הבנק וחברת האשראי, כגון ניהול חשבון, פעולות ודמי כרטיס. ריבית על הלוואה או מינוס היא רכיב אחר.`,`מלאו אומדן חודשי כולל של עמלות החשבונות ודמי הכרטיסים. סכמו את שורות העמלות בדפי החשבון ובפירוט האשראי; חיוב תקופתי חלקו במספר החודשים שהוא מכסה.`),credit_frame:x(`מסגרת אשראי בעו״ש היא הסכום שהבנק מאפשר לנצל כיתרת חובה, כלומר מינוס. כאן שואלים אם אתם משתמשים בה בפועל.`,`סמנו כן אם החשבון במינוס במסגרת האשראי. עצם קיומה של מסגרת אינו אומר שהיא מנוצלת. אין הכוונה למסגרת הרכישות בכרטיס האשראי.`),wt:x(`יעד כספי: כמה תרצו להכין לחתונת הילד או הילדה. זהו סכום לתכנון, ולא התחייבות או המלצה לסכום מסוים.`,`מלאו את חלקכם המתוכנן בהוצאות בשקלים. אם יש שדה נפרד לעזרה בדירה, אל תכללו את אותו סכום בשניהם. אפשר להשאיר ריק אם עוד לא החלטתם.`),wa:x(`הגיל המשוער שבו יידרש הכסף עבור הילד או הילדה, כדי להבין כמה זמן נותר לחיסכון.`,`מלאו גיל בשנים, ולא שנת לוח. זהו אומדן בלבד; אפשר לעדכן בהמשך או להשאיר ריק אם אין יעד.`),wh:x(`סכום העזרה שתרצו לתת לילד או לילדה לצורך דיור, בנפרד מהוצאות החתונה.`,`מלאו יעד משוער בשקלים, לפי מה שנראה לכם אפשרי. אין צורך להתחייב לסכום ואין לספור שוב כסף שכבר נכלל ביעד החתונה.`),ws:x(`כסף שכבר נצבר ושאתם מייעדים לילד או לילדה האלה.`,`מלאו יתרה קיימת, לא סכום שאתם מקווים לצבור בעתיד. אם אותו כסף מיועד לכמה ילדים, אל תרשמו את מלוא הסכום אצל כל אחד.`),wed_monthly:x(`סכום שהמשפחה מעריכה שתוכל להפנות מדי חודש לחיסכון לחתונות הילדים.`,`חשבו על סכום שנותר אחרי ההוצאות וההחזרים. זהו יעד משפחתי כולל לכל הילדים, ולא סכום לכל ילד או הוראת קבע חדשה.`),wed_lump:x(`סכום שכבר קיים ושאפשר לייעד פעם אחת לחתונות הילדים.`,`מלאו כסף קיים למטרה זו, ולא הכנסה עתידית. אם כבר רשמתם אותו כחיסכון של ילד מסוים, אל תספרו אותו שוב כאן; הציגו לנציג איך חילקתם את הכסף.`)},S={savings:{pension:x(`פנסיה היא חיסכון שנועד לספק הכנסה לאחר הפרישה. בחלק ממוצרי הפנסיה קיימים גם כיסויים למצב של פגיעה בכושר העבודה או פטירה.`,`סמנו אם יש לכם חיסכון פנסיוני, גם ממקום עבודה קודם. בדקו בדוח הפנסיה או בהפרשות בתלוש; סוגי הכיסוי והתנאים מופיעים במסמכי המוצר.`),hishtalmut:x(`קרן השתלמות היא מוצר חיסכון לשכירים ולעצמאים, הנפרד מהפנסיה. הכסף מושקע במסלול שנבחר לקרן.`,`בדקו בדוח הקרן או בתלוש אם קיימת קרן לאחד מבני הזוג. מועד הנזילות ותנאי המשיכה תלויים בקרן ובמצב האישי; אין להניח שכל היתרה זמינה מיד.`),gemel:x(`קופת גמל היא שם למשפחה של מוצרי חיסכון, שחלקם מיועדים לפרישה. תנאי ההפקדה והמשיכה משתנים לפי סוג הקופה ומועד ההפקדות.`,`בדקו את השם המדויק בדוח. אם כתוב ״קופת גמל להשקעה״, יש לכך אפשרות נפרדת. אם סוג המוצר אינו ברור, הציגו את הדוח לנציג.`),gemel_inv:x(`קופת גמל להשקעה היא מוצר שבו מפקידים כסף והוא מושקע במסלול שבוחרים. השווי עשוי לעלות או לרדת.`,`סמנו אם זה השם שמופיע בדוח. היא שונה מקופת גמל פנסיונית; את תנאי המשיכה והמיסוי מבררים לפי המוצר והנסיבות.`),policy:x(`פוליסת חיסכון היא מוצר השקעה של חברת ביטוח. הכוונה לכסף שמושקע לחיסכון, ולא לביטוח חיים או בריאות.`,`בדקו בדוח חברת הביטוח. מסלול ההשקעה, דמי הניהול ותנאי המשיכה מופיעים במסמכים; שווי ההשקעה אינו מובטח מעצם היותה בחברת ביטוח.`),portfolio:x(`תיק ניירות ערך הוא חשבון השקעות שבו מוחזקים למשל מניות, איגרות חוב או קרנות, בבנק או בבית השקעות.`,`סמנו גם אם אתם מנהלים אותו בעצמכם וגם אם מנוהל עבורכם. בדקו בדוח ההחזקות; אין צורך למסור פרטי כניסה לחשבון.`),deposits:x(`פיקדון הוא כסף שמופקד בבנק לפי תנאים שנקבעו מראש, בדרך כלל תמורת ריבית. הוא נפרד מהיתרה השוטפת בעו״ש.`,`סמנו פיקדון פעיל לפי היישומון או אישור ההפקדה. מועד הסיום והאפשרות למשוך לפניו תלויים בתנאי הפיקדון.`),other:x(`חיסכון או השקעה שאינם מתאימים לסוגים המופיעים ברשימה.`,`סמנו אם קיים מוצר נוסף, והכינו לשיחה את שמו ואת הדוח שלו אם יש. אין צורך לבחור סוג שאינכם בטוחים שמתאים.`)},ins:{health:x(`ביטוח בריאות פרטי עשוי לכסות טיפולים או הוצאות רפואיות המוגדרים בפוליסה, בהתאם לתנאים.`,`סמנו אם יש פוליסת בריאות בחברת ביטוח, כולל דרך מקום עבודה. חברות בקופת חולים או ביטוח משלים של הקופה אינם בהכרח פוליסה פרטית; בדקו במסמכי הביטוח.`),life:x(`ביטוח חיים מעניק תשלום במקרה פטירה לפי תנאי הפוליסה ולמי שנקבעו כמוטבים — מקבלי התשלום.`,`בדקו בדף פרטי הביטוח מי המבוטח, מי המוטבים ומה הכיסוי. ביטוח למשכנתא מופיע בנפרד. כיסוי במסגרת הפנסיה אינו בהכרח פוליסת חיים נפרדת.`),critical:x(`ביטוח מחלות קשות עשוי לשלם סכום שנקבע בפוליסה בעקבות אבחון מחלה או מצב רפואי המנויים בה, בכפוף לתנאים.`,`סמנו אם יש פוליסה בשם זה. הוא שונה מביטוח שמשלם הוצאות טיפול, ולא כל מחלה נכללת בו. בדקו את שם המוצר ברשימת הפוליסות.`),mort_life:x(`ביטוח חיים למשכנתא נועד לסייע בפירעון חוב המשכנתא במקרה פטירת מבוטח, בהתאם לפוליסה. הוא שונה מביטוח מבנה.`,`סמנו אם יש ביטוח
